<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Renewal - Renewal Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">RCMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="add-renewal.html" id="navAddEdit"><i class="bi bi-plus-circle"></i> Add Renewal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="records.html"><i class="bi bi-table"></i> Records</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html"><i class="bi bi-calendar"></i> Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm" style="border-radius: 10px;">
                    <div class="card-header bg-white py-3">
                        <h4 class="mb-0 text-primary fw-bold" id="formTitle">Add New Renewal</h4>
                    </div>
                    <div class="card-body p-4">
                        <div id="formAlert"></div>

                        <form id="renewalForm">
                            <input type="hidden" id="renewalId">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Renewal Name *</label>
                                    <input type="text" class="form-control" id="renewalName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Renewal Type *</label>
                                    <select class="form-select" id="renewalType" required>
                                        <option value="">Select Type</option>
                                        <option value="Contract">Contract</option>
                                        <option value="License">License</option>
                                        <option value="Certification">Certification</option>
                                        <option value="Warranty">Warranty</option>
                                        <option value="Insurance">Insurance</option>
                                        <option value="Subscription">Subscription</option>
                                        <option value="Regulatory Permit">Regulatory Permit</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Organization/Department *</label>
                                    <input type="text" class="form-control" id="organization" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Document Name/Ref</label>
                                    <input type="text" class="form-control" id="documentName">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Description</label>
                                <textarea class="form-control" id="description" rows="3"></textarea>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Start Date</label>
                                    <input type="date" class="form-control" id="startDate">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Expiry/Renewal Date *</label>
                                    <input type="date" class="form-control" id="renewalDate" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Responsible Person</label>
                                    <input type="text" class="form-control" id="responsiblePerson">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" id="responsibleEmail">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Status</label>
                                    <select class="form-select" id="status">
                                        <option value="Active">Active</option>
                                        <option value="Due Soon">Due Soon</option>
                                        <option value="Expired">Expired</option>
                                        <option value="Renewed">Renewed</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Reminder Days Before Expiry</label>
                                    <input type="number" class="form-control" id="reminderDays" value="30" min="1">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                                <a href="records.html" class="btn btn-outline-secondary d-none" id="cancelBtn">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Save Renewal</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/add-renewal.js"></script>
</body>
</html>
