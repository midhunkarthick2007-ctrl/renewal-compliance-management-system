<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Renewal Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">RCMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add-renewal.html"><i class="bi bi-plus-circle"></i> Add Renewal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="records.html"><i class="bi bi-table"></i> Records</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html"><i class="bi bi-calendar"></i> Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 mb-5">
        <h2 class="mb-4">Alerts & Notifications</h2>

        <div class="row">
            <div class="col-lg-8 mx-auto">
                
                <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active text-danger fw-bold" id="expired-tab" data-bs-toggle="tab" data-bs-target="#expired" type="button" role="tab">Expired</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link text-warning fw-bold" id="urgent-tab" data-bs-toggle="tab" data-bs-target="#urgent" type="button" role="tab">Due < 7 Days</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link text-primary fw-bold" id="upcoming-tab" data-bs-toggle="tab" data-bs-target="#upcoming" type="button" role="tab">Upcoming</button>
                    </li>
                </ul>
                
                <div class="tab-content" id="myTabContent">
                    <!-- Expired Tab -->
                    <div class="tab-pane fade show active" id="expired" role="tabpanel">
                        <div id="expiredContainer">
                            <div class="text-center p-5 text-muted">Loading...</div>
                        </div>
                    </div>
                    
                    <!-- Urgent Tab -->
                    <div class="tab-pane fade" id="urgent" role="tabpanel">
                        <div id="urgentContainer">
                            <div class="text-center p-5 text-muted">Loading...</div>
                        </div>
                    </div>
                    
                    <!-- Upcoming Tab -->
                    <div class="tab-pane fade" id="upcoming" role="tabpanel">
                        <div id="upcomingContainer">
                            <div class="text-center p-5 text-muted">Loading...</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
