<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Renewal Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #dee2e6;
            border: 1px solid #dee2e6;
        }
        .calendar-day-header {
            background-color: #f8f9fa;
            text-align: center;
            font-weight: bold;
            padding: 10px;
        }
        .calendar-day {
            background-color: #fff;
            min-height: 100px;
            padding: 5px;
            position: relative;
        }
        .calendar-day.empty {
            background-color: #f8f9fa;
        }
        .calendar-day.today {
            background-color: #e8f4f8;
        }
        .day-number {
            font-weight: bold;
            color: #6c757d;
            margin-bottom: 5px;
            display: block;
        }
        .renewal-event {
            font-size: 0.75rem;
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 3px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">RCMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="add-renewal.html"><i class="bi bi-plus-circle"></i> Add Renewal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="records.html"><i class="bi bi-table"></i> Records</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="calendar.html"><i class="bi bi-calendar"></i> Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 mb-5">
        <h2 class="mb-4">Renewal Calendar</h2>

        <div class="card shadow-sm" style="border-radius: 10px;">
            <div class="card-body">
                <div class="calendar-header">
                    <button class="btn btn-outline-primary" id="prevMonth"><i class="bi bi-chevron-left"></i></button>
                    <h4 id="monthYearDisplay" class="mb-0 fw-bold text-primary">Month Year</h4>
                    <button class="btn btn-outline-primary" id="nextMonth"><i class="bi bi-chevron-right"></i></button>
                </div>

                <div class="calendar-grid" id="calendarGrid">
                    <!-- Day Headers -->
                    <div class="calendar-day-header">Sun</div>
                    <div class="calendar-day-header">Mon</div>
                    <div class="calendar-day-header">Tue</div>
                    <div class="calendar-day-header">Wed</div>
                    <div class="calendar-day-header">Thu</div>
                    <div class="calendar-day-header">Fri</div>
                    <div class="calendar-day-header">Sat</div>
                    
                    <!-- Calendar cells will be injected here -->
                </div>
                
                <div class="mt-4 d-flex justify-content-center gap-4">
                    <div><span class="badge bg-success">&nbsp;&nbsp;</span> Active</div>
                    <div><span class="badge bg-warning text-dark">&nbsp;&nbsp;</span> Due Soon</div>
                    <div><span class="badge bg-danger">&nbsp;&nbsp;</span> Expired</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
